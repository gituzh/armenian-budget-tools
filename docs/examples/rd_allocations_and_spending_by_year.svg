<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="chart-title chart-desc">
<defs>
<style><![CDATA[text { font-family: Arial, 'Helvetica Neue', 'Segoe UI', sans-serif; fill: #1f2937; }.title { font-size: 24px; font-weight: 700; }.subtitle { font-size: 13px; fill: #4b5563; }.axis { font-size: 12px; fill: #374151; }.tick { font-size: 11px; fill: #6b7280; }.legend { font-size: 12px; fill: #374151; }.label { font-size: 11px; font-weight: 600; }.note { font-size: 12px; fill: #4b5563; }]]></style>
<pattern id="partialActual" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
